name: attendance_ontrack
description: A new Flutter project.
version: 1.0.2
publish_to: 'none'

environment:
  sdk: '>=2.19.0 <3.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.2
  http: ^1.1.0
  fluttertoast: ^8.2.4
  geolocator: ^10.0.1
  device_info_plus: ^11.2.1
  flutter_local_notifications: ^18.0.0
  app_settings: ^5.1.1
  numberpicker: ^2.1.0
  shared_preferences: ^2.1.0
  permission_handler: ^11.4.0
  progress_dialog_null_safe: ^1.0.4
  change_app_package_name: ^1.4.0
  edge_alerts: ^0.0.1
  flutter_launcher_icons: ^0.12.0

flutter_icons:
  android: true
  ios: true
  image_path: "assets/appicon.png"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/